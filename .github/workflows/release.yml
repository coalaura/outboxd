name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  project_name: outboxd

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate stable SemVer tag and commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be a stable SemVer tag such as v1.2.3" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Release tags must be annotated tags" >&2
            exit 1
          fi

          tagged_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$tagged_commit" != "$event_commit" || "$(git rev-parse HEAD)" != "$tagged_commit" ]]; then
            echo "Checked-out commit does not match $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Check tidy modules
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive_base="${{ env.project_name }}_${version}_${GOOS}_${GOARCH}"
          package_dir="staging/${archive_base}"
          binary="${{ env.project_name }}"
          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi

          mkdir -p "$package_dir" dist
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "${package_dir}/${binary}" .
          cp LICENSE README.md "$package_dir/"

          licenses="${package_dir}/THIRD_PARTY_LICENSES"
          mkdir "$licenses"
          go_version="$(go env GOVERSION)"
          printf 'go\t%s\n' "$go_version" > "${licenses}/MODULES.txt"
          cp "$(go env GOROOT)/LICENSE" "${licenses}/go_${go_version}.txt"
          while read -r module module_version; do
            [[ -n "$module" && -n "$module_version" ]]
            module_dir="$(go list -m -f '{{.Dir}}' "${module}@${module_version}")"
            archive_name="${module//\//__}@${module_version}"
            printf '%s\t%s\n' "$module" "$module_version" >> "${licenses}/MODULES.txt"
            for notice in \
              "${module_dir}"/LICENSE "${module_dir}"/LICENSE.* \
              "${module_dir}"/COPYING "${module_dir}"/COPYING.* \
              "${module_dir}"/NOTICE "${module_dir}"/NOTICE.*; do
              if [[ -f "$notice" ]]; then
                cp "$notice" "${licenses}/${archive_name}__${notice##*/}"
              fi
            done
          done < <(go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}} {{.Version}}{{end}}{{end}}' . | sed '/^$/d' | sort -u)

          if [[ "$GOOS" == "linux" ]]; then
            cp -R conf "$package_dir/"
            chmod 0755 "${package_dir}/${binary}" "${package_dir}"/conf/*.sh
          fi

          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            test "$("${package_dir}/${binary}" --version)" = "$GITHUB_REF_NAME"
            test "$("${package_dir}/${binary}" version)" = "$GITHUB_REF_NAME"
          fi

          if [[ "$GOOS" == "windows" ]]; then
            (cd staging && zip -qr "../dist/${archive_base}.zip" "$archive_base")
          else
            tar -C staging -czf "dist/${archive_base}.tar.gz" "$archive_base"
          fi

      - name: Upload archive
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.project_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Release
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release commit
        if: ${{ !env.ACT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download archives
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.project_name }}_*
          path: release
          merge-multiple: true

      - name: Generate and verify checksums
        if: ${{ !env.ACT }}
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "outboxd_${version}_darwin_amd64.tar.gz"
            "outboxd_${version}_darwin_arm64.tar.gz"
            "outboxd_${version}_linux_amd64.tar.gz"
            "outboxd_${version}_linux_arm64.tar.gz"
            "outboxd_${version}_windows_amd64.zip"
            "outboxd_${version}_windows_arm64.zip"
          )
          mapfile -t actual < <(printf '%s\n' * | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Revalidate remote tag before draft
        if: ${{ !env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_object="$(git rev-parse "$tag_ref")"
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{commit}")" = "$commit"
          test "$(git rev-parse HEAD)" = "$commit"
          mapfile -t remote < <(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")
          test "${#remote[@]}" -eq 2
          printf '%s\n' "${remote[@]}" | grep -Fx "$tag_object"$'\t'"$tag_ref"
          printf '%s\n' "${remote[@]}" | grep -Fx "$commit"$'\t'"${tag_ref}^{}"

      - name: Create draft release
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "outboxd $GITHUB_REF_NAME" \
            --generate-notes
          touch .release-draft-created

      - name: Upload exact release assets
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "release/outboxd_${version}_darwin_amd64.tar.gz" \
            "release/outboxd_${version}_darwin_arm64.tar.gz" \
            "release/outboxd_${version}_linux_amd64.tar.gz" \
            "release/outboxd_${version}_linux_arm64.tar.gz" \
            "release/outboxd_${version}_windows_amd64.zip" \
            "release/outboxd_${version}_windows_arm64.zip" \
            release/SHA256SUMS

      - name: Verify uploaded release assets
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            SHA256SUMS
            "outboxd_${version}_darwin_amd64.tar.gz"
            "outboxd_${version}_darwin_arm64.tar.gz"
            "outboxd_${version}_linux_amd64.tar.gz"
            "outboxd_${version}_linux_arm64.tar.gz"
            "outboxd_${version}_windows_amd64.zip"
            "outboxd_${version}_windows_arm64.zip"
          )
          mapfile -t actual < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          mkdir verified
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir verified
          for asset in "${expected[@]}"; do
            cmp "release/$asset" "verified/$asset"
          done
          (cd verified && sha256sum --check --strict SHA256SUMS)

      - name: Revalidate remote tag before publication
        if: ${{ !env.ACT }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_object="$(git rev-parse "$tag_ref")"
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{commit}")" = "$commit"
          test "$(git rev-parse HEAD)" = "$commit"
          mapfile -t remote < <(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")
          test "${#remote[@]}" -eq 2
          printf '%s\n' "${remote[@]}" | grep -Fx "$tag_object"$'\t'"$tag_ref"
          printf '%s\n' "${remote[@]}" | grep -Fx "$commit"$'\t'"${tag_ref}^{}"

      - name: Publish verified release
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Delete failed draft
        if: ${{ !env.ACT && (failure() || cancelled()) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f .release-draft-created && "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == true ]]; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
